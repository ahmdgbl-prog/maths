<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>منصة الأستاذ أحمد أبو جبل التعليمية - مهارة الضرب</title>
    <style>
        :root { 
            --sand-bg: #F5F5DC; 
            --gold-primary: #d4af37;
            --gold-dark: #aa841b;
            --primary: #2c3e50; 
            --error: #e74c3c; 
            --success: #27ae60; 
            --factor1-color: #2980b9; 
            --factor2-color: #e67e22; 
            --gold-wm: rgba(212, 175, 55, 0.25); 
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation; 
            -webkit-user-select: none;
            user-select: none;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--sand-bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            min-height: 100dvh;
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }
        
        .app-container { 
            width: 100%; 
            max-width: 550px; 
            background: white; 
            padding: 25px 20px; 
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            text-align: center; 
            border: 8px solid var(--primary); 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start;
            height: auto; 
            max-height: 96vh; 
            max-height: 96dvh;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }

        .app-container::-webkit-scrollbar { width: 6px; }
        .app-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .app-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .islamic-pattern {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle, rgba(212,175,55,0.04) 2px, transparent 4px),
                              linear-gradient(45deg, rgba(212,175,55,0.02) 25%, transparent 25%, transparent 75%, rgba(212,175,55,0.02) 75%, rgba(212,175,55,0.02)),
                              linear-gradient(45deg, rgba(212,175,55,0.02) 25%, transparent 25%, transparent 75%, rgba(212,175,55,0.02) 75%, rgba(212,175,55,0.02));
            background-size: 30px 30px, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 30px 30px;
            z-index: 1;
            pointer-events: none;
        }

        .blinking-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.3rem;
            font-weight: 900;
            color: rgba(212, 175, 55, 0.07);
            white-space: nowrap;
            z-index: 1;
            pointer-events: none;
            animation: slowBlink 5s infinite ease-in-out;
        }

        @keyframes slowBlink {
            0%, 100__ { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .side-watermark {
            position: absolute; top: 0; bottom: 0; width: 40px;
            display: flex; flex-direction: column; justify-content: space-around;
            align-items: center; font-size: 1.1rem; font-weight: 900; 
            color: var(--gold-wm); pointer-events: none; z-index: 1;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.05);
        }
        .wm-left { left: 5px; } 
        .wm-right { right: 5px; }
        .wm-text { transform: rotate(-90deg); white-space: nowrap; margin: 15px 0; }

        .quiz-content { 
            position: relative; 
            z-index: 3; 
            width: 100%; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .skill-title {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .skill-subtitle {
            color: var(--gold-dark);
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .selection-heading {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .style-cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 30px;
        }

        .style-card {
            background: #fff;
            border: 3px solid #e0e0e0;
            border-radius: 20px;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .style-card:hover { border-color: var(--gold-primary); background: #fffdf7; }
        .style-card.selected { border-color: var(--primary); background: #f0f4f8; box-shadow: 0 6px 12px rgba(44,62,80,0.15); }
        .card-info { display: flex; align-items: center; gap: 12px; }
        .card-icon { font-size: 2rem; }
        .card-text { font-size: 1.2rem; font-weight: bold; color: var(--primary); text-align: right; }
        .radio-dot { width: 20px; height: 20px; border: 3px solid #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .style-card.selected .radio-dot { border-color: var(--primary); background: var(--primary); }
        .style-card.selected .radio-dot::after { content: ''; width: 8px; height: 8px; background: white; border-radius: 50%; }

        .start-btn {
            width: 100%; max-width: 340px; background: linear-gradient(135deg, var(--primary), #34495e);
            color: white; font-size: 1.6rem; font-weight: bold; padding: 16px; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(44,62,80,0.2); transition: all 0.2s;
        }
        .start-btn:active { transform: scale(0.98); }
        
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        #progress { font-size: 1.3rem; font-weight: bold; color: #7f8c8d; }
        
        .nav-action-btn {
            background: #fff;
            border: 2px solid var(--gold-primary);
            color: var(--gold-dark);
            padding: 6px 14px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .nav-action-btn:active { transform: scale(0.95); background: #fffdf7; }

        .math-grid { 
            display: grid; 
            grid-template-columns: 1fr 40px; 
            align-items: center; 
            margin: 15px auto;
            max-width: 220px;
            width: 100%;
        }
        
        .digit-row {
            grid-column: 1;
            text-align: left;
            padding-right: 20px;
            font-size: clamp(3rem, 12vw, 4.5rem); 
            font-weight: 900; 
            line-height: 1.1;
            letter-spacing: 2px;
        }
        .factor1 { color: var(--factor1-color); }
        .factor2 { color: var(--factor2-color); }
        
        .sign { 
            font-size: 3rem; 
            color: var(--primary); 
            font-weight: bold; 
            grid-column: 2; 
            grid-row: 2; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .v-line { 
            grid-column: 1 / span 2; 
            border-top: 6px solid var(--primary); 
            margin: 10px 0; 
            border-radius: 10px; 
        }
        
        .input-cell { grid-column: 1 / span 2; display: flex; justify-content: center; width: 100%; }
        
        .digit-input { 
            width: 100%; 
            max-width: 180px;
            height: clamp(60px, 15vw, 85px); 
            font-size: clamp(2.2rem, 10vw, 3.5rem); 
            font-weight: 900; 
            text-align: center; 
            border: 4px solid var(--primary); 
            border-radius: 18px; 
            outline: none; 
            background: #fff; 
            color: var(--primary);
            letter-spacing: 2px;
        }

        .correct-box { background: #e8f5e9 !important; border-color: var(--success) !important; color: var(--success) !important; }
        .wrong-box { background: #ffebee !important; border-color: var(--error) !important; color: var(--error) !important; }

        .custom-keyboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px auto 0 auto;
            max-width: 320px;
            width: 100%;
        }

        .layout-hindi { direction: ltr; }
        .layout-arabic { direction: ltr; }

        .key-btn {
            background: var(--primary);
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            padding: 12px 0;
            cursor: pointer;
            box-shadow: 0 4px 0 #1a252f;
            transition: all 0.1s;
        }

        .key-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1a252f;
            background: #34495e;
        }

        .key-delete {
            background: var(--error);
            box-shadow: 0 4px 0 #c0392b;
            grid-column: span 2;
            font-size: 1.4rem;
        }
        .key-delete:active { background: #e67e22; box-shadow: 0 0 0 #c0392b; }

        .error-hint { color: var(--error); font-size: 1.2rem; font-weight: bold; display: block; margin: 8px 0; line-height: 1.4; }
        #hint-area { min-height: 45px; margin-top: 5px; display: flex; flex-direction: column; align-items: center; }

        .continue-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 0 #1e7e34;
            animation: pulseBtn 1.5s infinite;
        }
        .continue-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1e7e34; }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        #report { padding: 20px; }
        .final-score-val { font-size: 4.5rem; font-weight: 900; margin: 15px 0; }
        .restart-btn {
            width: 100%; padding: 18px; font-size: 1.5rem; font-weight: bold; 
            background: var(--primary); color: white; border: none; border-radius: 20px; cursor: pointer;
        }

        @media (max-width: 600px), (max-height: 750px) {
            body { padding: 5px; }
            .app-container { padding: 15px 12px; border-width: 5px; border-radius: 22px; max-height: 98vh; max-height: 98dvh; }
            .digit-row { font-size: 2.8rem; }
            .digit-input { height: 58px; font-size: 2.1rem; border-width: 3px; max-width: 150px; }
            .custom-keyboard { gap: 8px; max-width: 290px; margin-top: 8px; }
            .key-btn { padding: 10px 0; font-size: 1.6rem; }
            .sign { font-size: 2.2rem; }
            .v-line { margin: 6px 0; border-top-width: 4px; }
            .skill-title { font-size: 1.7rem; }
            .skill-subtitle { font-size: 1.1rem; margin-bottom: 15px; }
            .style-cards { margin-bottom: 15px; gap: 8px; }
            .style-card { padding: 10px 15px; }
            .blinking-watermark { font-size: 1.8rem; }
            .nav-action-btn { padding: 5px 10px; font-size: 0.85rem; }
            .continue-btn { font-size: 1rem; padding: 8px 20px; }
        }
    </style>
</head>
<body>

    <div class="app-container" id="main-container">
        <div class="islamic-pattern"></div>
        <div class="blinking-watermark">أحمد فتحي أبو جبل</div>

        <div class="side-watermark wm-left">
            <div class="wm-text">أحمد فتحي أبو جبل</div><div class="wm-text">أحمد فتحي أبو جبل</div>
        </div>
        <div class="side-watermark wm-right">
            <div class="wm-text">أحمد فتحي أبو جبل</div><div class="wm-text">أحمد فتحي أبو جبل</div>
        </div>

        <div class="quiz-content">
            <div id="welcome-screen">
                <div class="skill-title">جدول الضرب الذكي</div>
                <div class="skill-subtitle">منصة الأستاذ أحمد أبو جبل التعليمية</div>
                
                <div class="selection-heading">اختر نظام الأرقام لبدء التحدي:</div>
                
                <div class="style-cards">
                    <div class="style-card selected" id="opt-hindi" onclick="selectStyleOption('hindi')">
                        <div class="card-info">
                            <span class="card-icon">🔢</span>
                            <span class="card-text">أرقام هندية المناهج العربية (١٢٣)</span>
                        </div>
                        <div class="radio-dot"></div>
                    </div>
                    
                    <div class="style-card" id="opt-arabic" onclick="selectStyleOption('arabic')">
                        <div class="card-info">
                            <span class="card-icon">🔤</span>
                            <span class="card-text">أرقام عربية للمدارس الدولية (123)</span>
                        </div>
                        <div class="radio-dot"></div>
                    </div>
                </div>
                
                <button class="start-btn" onclick="startQuiz()">ابدأ الاختبار الآن 🚀</button>
            </div>

            <div id="quiz-part" style="display:none;">
                <div class="top-nav">
                    <button class="nav-action-btn" onclick="goBackToWelcome()">🏡 القائمة الرئيسية</button>
                    <div id="progress">السؤال ١ من ١٥</div>
                    <button class="nav-action-btn" onclick="toggleSystemRuntime()">🔄 تغيير النظام</button>
                </div>
                
                <div class="math-grid">
                    <div class="digit-row factor1" id="factor1-view">٠</div>
                    <div></div>
                    
                    <div class="digit-row factor2" id="factor2-view">٠</div>
                    <div class="sign">×</div>
                    
                    <div class="v-line"></div>
                    
                    <div class="input-cell">
                        <input type="text" id="input-answer" class="digit-input" readonly>
                    </div>
                </div>

                <div id="hint-area"></div>

                <div class="custom-keyboard layout-hindi" id="keyboard">
                    <button class="key-btn num-key" onclick="handleKeyPress(1)">1</button>
                    <button class="key-btn num-key" onclick="handleKeyPress(2)">2</button>
                    <button class="key-btn num-key" onclick="handleKeyPress(3)">3</button>
                    <button class="key-btn num-key" onclick="handleKeyPress(4)">4</button>
                    <button class="key-btn num-key" onclick="handleKeyPress(5)">5</button>
                    <button class="key-btn num-key" onclick="handleKeyPress(6)">6</button>
                    <button class="key-btn num-key" onclick="handleKeyPress(7)">7</button>
                    <button class="key-btn num-key" onclick="handleKeyPress(8)">8</button>
                    <button class="key-btn num-key" onclick="handleKeyPress(9)">9</button>
                    <button class="key-btn key-delete" onclick="handleDelete()">مسح ⌫</button>
                    <button class="key-btn num-key" onclick="handleKeyPress(0)">0</button>
                </div>
            </div>

            <div id="report" style="display:none;">
                <h2 style="color: var(--primary); font-size: 2.5rem;">النتيجة النهائية</h2>
                <div id="final-score" class="final-score-val"></div>
                <div id="feedback-msg" style="font-size: 1.6rem; margin-bottom: 35px; font-weight: bold; line-height: 1.4;"></div>
                <button class="restart-btn" onclick="location.reload()">إعادة الاختبار 🔄</button>
            </div>
        </div>
    </div>

    <script>
        let counter = 0, score = 0, isWaiting = false;
        const totalQuestions = 15;
        const hindiDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
        let currentStyle = 'hindi';
        let audioCtx = null;
        
        let questions = [];
        let usedPairsSet = new Set(); 

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        document.body.addEventListener('click', initAudioContext, { once: false });

        function selectStyleOption(style) {
            currentStyle = style;
            document.getElementById('opt-hindi').classList.remove('selected');
            document.getElementById('opt-arabic').classList.remove('selected');
            if(style === 'hindi') {
                document.getElementById('opt-hindi').classList.add('selected');
            } else {
                document.getElementById('opt-arabic').classList.add('selected');
            }
        }

        function toggleSystemRuntime() {
            currentStyle = (currentStyle === 'hindi') ? 'arabic' : 'hindi';
            
            const kb = document.getElementById('keyboard');
            kb.className = (currentStyle === 'hindi') ? "custom-keyboard layout-hindi" : "custom-keyboard layout-arabic";
            updateKeyboardStyle();
            
            if (document.getElementById('quiz-part').style.display === 'block' && questions[counter]) {
                const q = questions[counter];
                document.getElementById('factor1-view').innerText = formatNum(q.f1);
                document.getElementById('factor2-view').innerText = formatNum(q.f2);
                document.getElementById('progress').innerText = `السؤال ${formatNum(counter+1)} من ${formatNum(totalQuestions)}`;
                
                const input = document.getElementById('input-answer');
                if(input.value !== "") {
                    let cleanRaw = input.value.replace(/[٠-٩]/g, d => hindiDigits.indexOf(d));
                    input.value = formatNum(cleanRaw);
                }
            }
        }

        function startQuiz() {
            initAudioContext();
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('quiz-part').style.display = 'block';
            
            questions = [];
            usedPairsSet.clear();
            while(questions.length < totalQuestions) {
                let q = generateUniqueMultiplicationQuestion();
                if(q) questions.push(q);
            }

            const kb = document.getElementById('keyboard');
            kb.className = currentStyle === 'hindi' ? "custom-keyboard layout-hindi" : "custom-keyboard layout-arabic";
            
            updateKeyboardStyle();
            load();
        }

        function goBackToWelcome() {
            if('speechSynthesis' in window) window.speechSynthesis.cancel();
            counter = 0; score = 0; isWaiting = false;
            document.getElementById('quiz-part').style.display = 'none';
            document.getElementById('report').style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'block';
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            if (type === 'success') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'error') {
                [0, 0.15].forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(160, now + delay);
                    gain.gain.setValueAtTime(0.1, now + delay); gain.gain.linearRampToValueAtTime(0.01, now + delay + 0.1);
                    osc.start(now + delay); osc.stop(now + delay + 0.1);
                });
            }
        }

        function speak(txt) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const m = new SpeechSynthesisUtterance(txt);
                m.lang = 'ar-SA';
                window.speechSynthesis.speak(m);
            }
        }

        function formatNum(n) { 
            if (currentStyle === 'hindi') {
                return n.toString().replace(/\d/g, d => hindiDigits[d]); 
            }
            return n.toString();
        }

        function updateKeyboardStyle() {
            const keys = document.querySelectorAll('.num-key');
            keys.forEach(key => {
                const val = key.getAttribute('onclick').match(/\d/)[0];
                key.innerText = formatNum(val);
            });
        }

        function handleKeyPress(num) {
            if (isWaiting) return;
            initAudioContext(); 
            
            const input = document.getElementById('input-answer');
            if(input.value.length < 3) {
                input.value += formatNum(num);
            }

            const rawInput = input.value.replace(/[٠-٩]/g, d => hindiDigits.indexOf(d));
            const q = questions[counter];
            if (parseInt(rawInput) === q.ans) {
                setTimeout(check, 250);
            } else if (rawInput.length >= q.ans.toString().length) {
                setTimeout(check, 400);
            }
        }

        function handleDelete() {
            if (isWaiting) return;
            const input = document.getElementById('input-answer');
            if (input.value.length > 0) {
                input.value = input.value.slice(0, -1);
            }
        }

        function generateUniqueMultiplicationQuestion() {
            let attempts = 0;
            while(attempts < 3000) {
                let f1 = Math.floor(Math.random() * 13); 
                let f2 = Math.floor(Math.random() * 13); 
                
                if (f1 > 9 && f2 > 9) continue; 

                let ans = f1 * f2;
                let low = Math.min(f1, f2);
                let high = Math.max(f1, f2);
                let key = `${low}x${high}`;

                if (!usedPairsSet.has(key)) {
                    usedPairsSet.add(key);
                    return { f1, f2, ans };
                }
                attempts++;
            }
            return null;
        }

        function load() {
            if (counter >= totalQuestions) { finish(); return; }
            const q = questions[counter];
            
            document.getElementById('factor1-view').innerText = formatNum(q.f1);
            document.getElementById('factor2-view').innerText = formatNum(q.f2);
            document.getElementById('progress').innerText = `السؤال ${formatNum(counter+1)} من ${formatNum(totalQuestions)}`;
            
            const input = document.getElementById('input-answer');
            input.value = ""; 
            input.className = "digit-input";
            
            document.getElementById('hint-area').innerHTML = "";
            document.getElementById('keyboard').style.pointerEvents = 'auto';
            document.getElementById('keyboard').style.opacity = '1';
            isWaiting = false;
        }

        function check() {
            if (isWaiting) return;
            const input = document.getElementById('input-answer');
            const rawInput = input.value.replace(/[٠-٩]/g, d => hindiDigits.indexOf(d));
            
            if (rawInput === "") return;
            
            document.getElementById('keyboard').style.pointerEvents = 'none'; 
            document.getElementById('keyboard').style.opacity = '0.5';

            const userAns = parseInt(rawInput);
            const q = questions[counter];

            if (userAns === q.ans) {
                score++; playSound('success');
                input.classList.add('correct-box');
                speak("رائع! إجابة صحيحة");
                setTimeout(nextQuest, 1200);
            } else {
                playSound('error');
                input.classList.add('wrong-box');
                input.value = formatNum(q.ans); 
                
                // إضافة زر المتابعة بشكل آمن لمنع تخطي السؤال عشوائياً
                document.getElementById('hint-area').innerHTML = `
                    <span class='error-hint'>تذكر ناتج الضرب الموضح بالأعلى!</span>
                    <button class='continue-btn' onclick='nextQuest()'>السؤال التالي ➡️</button>
                `;
                isWaiting = true;
            }
        }

        function nextQuest() { counter++; load(); }

        function finish() {
            document.getElementById('quiz-part').style.display = 'none';
            document.getElementById('report').style.display = 'block';
            const p = Math.round((score / totalQuestions) * 100);
            document.getElementById('final-score').innerText = `%${formatNum(p)}`;
            document.getElementById('final-score').style.color = p >= 90 ? "var(--success)" : "var(--error)";
            
            let msg = "";
            if(p >= 95) msg = "مذهل يا بطل! لقد أتقنت عمليات الضرب تماماً ببراعة.";
            else if(p >= 80) msg = "عمل رائع! درجتك ممتازة وركز أكثر لتصل للدرجة الكاملة.";
            else msg = "تحتاج إلى مراجعة جدول الضرب جيداً، أعد المحاولة مجدداً لتصبح أقوى!";
            
            document.getElementById('feedback-msg').innerText = msg;
            speak(msg);
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('quiz-part').style.display === 'none') return;
            if(isWaiting) {
                if(e.key === 'Enter') nextQuest();
                return;
            }
            if (e.key >= '0' && e.key <= '9') {
                handleKeyPress(parseInt(e.key));
            } else if (e.key === 'Backspace') {
                handleDelete();
            } else if (e.key === 'Enter') {
                check();
            }
        });
    </script>
</body>
</html>
